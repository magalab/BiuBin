name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check HTTP route contract
        run: node scripts/check-http-route-contract.mjs
        working-directory: .
      - uses: actions/upload-artifact@v7
        with:
          name: biubin-web-dist
          path: web/dist

  rust:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - uses: actions/download-artifact@v8
        with:
          name: biubin-web-dist
          path: web/dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash scripts/blackbox.sh

  compose:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Docker Compose smoke
        run: bash scripts/compose-smoke.sh

  browser:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.0
      - uses: actions/download-artifact@v8
        with:
          name: biubin-web-dist
          path: web/dist
      - run: npm ci
        working-directory: web
      - run: cargo build --locked --bin biubin
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  compatibility:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.0
      - uses: actions/download-artifact@v8
        with:
          name: biubin-web-dist
          path: web/dist
      - name: Install external protocol clients
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients thrift-compiler
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
      - run: npm ci
        working-directory: web
      - run: cargo build --locked --bin biubin
      - name: Run generated-client compatibility smoke
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          BIUBIN_EXTERNAL_SMOKE=1 bash scripts/blackbox.sh
