syntax = "proto3";

package biubin.v1;

service Biubin {
  rpc Index(IndexRequest) returns (IndexResponse);
  rpc EchoUnary(EchoRequest) returns (EchoResponse);
  rpc EchoServerStream(EchoRequest) returns (stream EchoResponse);
  rpc EchoClientStream(stream EchoRequest) returns (StreamSummary);
  rpc EchoBidiStream(stream EchoRequest) returns (stream EchoResponse);
  rpc Error(ErrorRequest) returns (Empty);
}

message Empty {}

message IndexRequest {
  string client_name = 1;
}

message IndexResponse {
  string service = 1;
  string version = 2;
  repeated string methods = 3;
  repeated string modes = 4;
}

message EchoRequest {
  string message = 1;
  bytes payload = 2;
  uint32 count = 3;
  uint64 interval_ms = 4;
}

message EchoResponse {
  string message = 1;
  bytes payload = 2;
  uint64 sequence = 3;
  repeated string metadata_keys = 4;
}

message StreamSummary {
  uint64 count = 1;
  string last_message = 2;
  bytes last_payload = 3;
}

message ErrorRequest {
  uint32 code = 1;
  string message = 2;
  bool include_trailer = 3;
}

